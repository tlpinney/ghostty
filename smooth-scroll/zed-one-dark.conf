# Match Zed's defaults (One Dark, Lilex 16) for side-by-side scroll comparison.
font-family = Lilex
font-size = 16
background = #282c33
foreground = #acb2be
cursor-color = #74ade8
selection-background = #3d4b5c
selection-foreground = #dce0e5
palette = 0=#282c34
palette = 1=#e06c75
palette = 2=#98c379
palette = 3=#e5c07b
palette = 4=#61afef
palette = 5=#c678dd
palette = 6=#56b6c2
palette = 7=#abb2bf
palette = 8=#636d83
palette = 9=#ea858b
palette = 10=#aad581
palette = 11=#ffd885
palette = 12=#85c1ff
palette = 13=#d398eb
palette = 14=#6ed5de
palette = 15=#fafafa
# Zed "comfortable" line height: 16 * 1.618 = ~26px vs Ghostty natural 21.3px
adjust-cell-height = 22%
